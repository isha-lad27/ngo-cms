<!DOCTYPE html>
<html>
<head>
    <title>Projects</title>
</head>
<body>
    <h1>NGO Projects</h1>

    <table border="1">
        <tr>
            <th>Project Name</th>
            <th>Budget</th>
            <th>Start Date</th>
            <th>End Date</th>
        </tr>

        {% for project in projects %}
        <tr>
            <td>{{ project.project_name }}</td>
            <td>{{ project.budget }}</td>
            <td>{{ project.start_date }}</td>
            <td>{{ project.end_date }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No projects found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
