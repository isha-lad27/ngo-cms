<section class="container py-5 text-center">
    <h1>Media Gallery</h1>
    <p>Photos from our NGO activities.</p>
</section>

<section class="container pb-5">
    <div class="row g-4" id="imageGallery">

        <div class="col-12 text-center">
            <p>Loading images...</p>
        </div>

    </div>
</section>

<section class="container pb-5">
    <h2 class="text-center mb-4">Media Coverage</h2>

    <div class="row g-4" id="mediaCoverage">

        <div class="col-12 text-center">
            <p>Loading media coverage...</p>
        </div>

    </div>
</section>

<script>

const API_URL = "https://ngo-cms-fsbh.onrender.com/media/api/";

fetch(API_URL)
    .then(response => {
        if (!response.ok) {
            throw new Error("Unable to load media data");
        }

        return response.json();
    })
    .then(data => {

        const gallery = document.getElementById("imageGallery");
        const coverage = document.getElementById("mediaCoverage");

        gallery.innerHTML = "";

        if (data.images.length === 0) {

            gallery.innerHTML = `
                <div class="col-12 text-center">
                    <p>No images available.</p>
                </div>
            `;

        } else {

            data.images.forEach(image => {

                gallery.innerHTML += `
                    <div class="col-md-4">
                        <div class="card shadow h-100">

                            <img src="${image.image}"
                                 class="card-img-top"
                                 alt="${image.description}"
                                 style="height: 250px; object-fit: cover;">

                            <div class="card-body text-center">
                                <h4>${image.description}</h4>
                            </div>

                        </div>
                    </div>
                `;

            });
        }


        coverage.innerHTML = "";

        if (data.media_coverages.length === 0) {

            coverage.innerHTML = `
                <div class="col-12 text-center">
                    <p>No media coverage available.</p>
                </div>
            `;

        } else {

            data.media_coverages.forEach(item => {

                coverage.innerHTML += `
                    <div class="col-md-4">
                        <div class="card shadow h-100">

                            <div class="card-body text-center">

                                <h4>${item.title}</h4>

                                <a href="${item.url}"
                                   target="_blank"
                                   class="btn btn-success mt-3">
                                    Read More
                                </a>

                            </div>

                        </div>
                    </div>
                `;

            });
        }

    })
    .catch(error => {

        document.getElementById("imageGallery").innerHTML = `
            <div class="col-12 text-center">
                <p>Unable to load media gallery.</p>
            </div>
        `;

        document.getElementById("mediaCoverage").innerHTML = "";

        console.error(error);

    });

</script>

</body>
