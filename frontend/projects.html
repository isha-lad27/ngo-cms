<section class="container py-5 text-center">
    <h1>Our Projects</h1>
    <p>Some of our successful community projects.</p>
</section>

<section class="container pb-5">
    <div class="row" id="projects-container">
        <p class="text-center">Loading projects...</p>
    </div>
</section>

<script>
    const API_URL = "https://ngo-cms-fsbh.onrender.com/api/projects/";

    fetch(API_URL)
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load projects");
            }
            return response.json();
        })
        .then(projects => {
            const container = document.getElementById("projects-container");

            container.innerHTML = "";

            projects.forEach(project => {
                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card shadow h-100">
                            <div class="card-body">
                                <h3>${project.project_name}</h3>
                                <p>${project.description}</p>

                                <p><strong>Status:</strong> ${project.status}</p>
                                <p><strong>Location:</strong> ${project.location}</p>
                                <p><strong>Start:</strong> ${project.start_date}</p>
                                <p><strong>End:</strong> ${project.end_date}</p>
                                <p><strong>Budget:</strong> ₹${project.budget}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        })
        .catch(error => {
            console.error(error);

            document.getElementById("projects-container").innerHTML = `
                <div class="alert alert-danger">
                    Unable to load projects.
                </div>
            `;
        });
</script>
